services:
  - type: web
    name: ludo-online
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ludo-db
    plan: free
